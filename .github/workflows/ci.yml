name: CI

on:
  # Pre-release lines live on `prerelease/<version>` branches and ship betas from
  # there, so they are held to the same checks as main.
  push:
    branches: [main, "prerelease/**"]
  pull_request:
    branches: [main, "prerelease/**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx eslint src/
      - run: npx prettier --check "**/*.{ts,js,mjs,json,md,yml,yaml}"
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx markdownlint-cli2 "**/*.md"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
